<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>McIntosh Writer</title>
<style>
  :root {
    --bg: #f5f5f7;
    --panel: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --line: #d2d2d7;
    --accent: #0071e3;
    --warn: #b25000;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --panel: #1c1c1e;
      --text: #f5f5f7;
      --muted: #98989d;
      --line: #38383a;
      --accent: #2997ff;
      --warn: #ff9f0a;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
  }
  main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; margin: 0 0 16px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; }
  header nav { font-size: 13px; display: flex; gap: 14px; }
  a { color: var(--accent); text-decoration: none; }
  #stage {
    border-radius: 18px;
    min-height: clamp(200px, 40vw, 380px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    transition: background .3s;
    cursor: pointer;
    overflow: hidden;
    background: #ffffff;
  }
  #stage svg { width: 100%; max-height: 420px; display: block; }
  #setup { max-width: 560px; color: #1d1d1f; cursor: default; font-size: 14px; }
  #setup h2 { font-size: 17px; margin: 0 0 8px; }
  #setup code { font-size: 12px; word-break: break-all; background: #f0f0f2; padding: 1px 4px; border-radius: 4px; }
  .controls {
    margin-top: 16px;
    background: var(--panel);
    border-radius: 14px;
    padding: 16px;
    display: grid;
    gap: 14px;
  }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  #text {
    flex: 1 1 260px;
    font: inherit;
    font-size: 18px;
    line-height: 1.35;
    min-height: 72px;
    resize: vertical;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--text);
  }
  button, select {
    font: inherit;
    padding: 9px 16px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  label { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); }
  input[type=range] { width: 140px; }
  .file { color: var(--accent); cursor: pointer; }
  .file input { display: none; }
  #status { color: var(--muted); font-size: 13px; min-height: 1.5em; }
  #status .warn { color: var(--warn); }
</style>
</head>
<body>
<main>
  <header>
    <h1>McIntosh Writer</h1>
    <nav><a href="apple.html" data-i18n="nav.inspect">字形检查</a><a href="#" id="lang" data-i18n="nav.lang">English</a></nav>
  </header>
  <div id="stage" title="点按以重新播放" data-i18n-title="stage.hint"></div>
  <div class="controls">
    <div class="row">
      <textarea id="text" rows="2" placeholder="输入要书写的文字" data-i18n-placeholder="input.placeholder" aria-label="输入要书写的文字" data-i18n-aria-label="input.placeholder" autocomplete="off" spellcheck="false">hello</textarea>
      <button id="play" class="primary" data-i18n="btn.play">播放</button>
      <button id="export" data-i18n="btn.export">下载 SVG 动画</button>
      <label><span data-i18n="label.videoRatio">视频比例</span>
        <select id="video-ratio">
          <option value="16:9" data-i18n="videoRatio.landscape">横向 16:9</option>
          <option value="9:16" data-i18n="videoRatio.portrait">竖向 9:16</option>
        </select>
      </label>
      <button id="video-export" data-i18n="btn.video">导出视频</button>
      <button id="static-export" data-i18n="btn.static">导出静态图</button>
    </div>
    <div class="row">
      <label><span data-i18n="label.speed">速度</span> <input id="speed" type="range" min="0.4" max="2.5" step="0.1" value="1"></label>
      <label title="1.55× 与开机画面的粗细相同" data-i18n-title="weight.hint"><span data-i18n="label.weight">粗细</span> <input id="weight" type="range" min="0.5" max="2.5" step="0.05" value="1"> <span id="weightval">1.00×</span></label>
      <label><input id="center" type="checkbox" checked> <span data-i18n="label.center">文字居中</span></label>
      <label title="调整多行文字之间的距离" data-i18n-title="lineSpacing.hint"><span data-i18n="label.lineSpacing">行距</span> <input id="line-spacing" type="range" min="0.65" max="1.8" step="0.05" value="1"> <span id="line-spacing-val">1.00×</span></label>
      <label><span data-i18n="label.theme">配色</span>
        <select id="theme">
          <option value="ink" data-i18n="theme.ink">浅色</option>
          <option value="night" data-i18n="theme.night">深色</option>
          <option value="color" data-i18n="theme.color">渐变</option>
        </select>
      </label>
      <label id="gradient-mode-wrap" hidden><span data-i18n="label.gradientMode">渐变文字背景</span>
        <select id="gradient-mode">
          <option value="light" data-i18n="gradientMode.light">白色</option>
          <option value="dark" data-i18n="gradientMode.dark">深色</option>
        </select>
      </label>
      <label><span data-i18n="label.ocross">o 的连笔</span>
        <select id="ocross">
          <option value="" data-i18n="ocross.over">越过顶部</option>
          <option value="x" data-i18n="ocross.through">穿过中间</option>
        </select>
      </label>
      <label><span data-i18n="label.pjoin">p 和 s 的写法</span>
        <select id="pjoin">
          <option value="x" data-i18n="pjoin.one">一笔写完</option>
          <option value="" data-i18n="pjoin.lift">中途抬笔</option>
        </select>
      </label>
    </div>
    <div class="row">
      <label><span data-i18n="label.font">字体</span> <select id="src"></select></label>
      <label class="file"><span data-i18n="btn.chooseFont">选取字体…</span><input id="file" type="file" accept=".otf,.ttf" multiple></label>
    </div>
    <div id="status"></div>
  </div>
</main>
<script src="i18n.js"></script>
<script src="apple-shaper.js"></script>
<script src="apple-writer.js"></script>
<script src="apple-extras.js"></script>
<script src="apple-font.js"></script>
<script src="apple-source.js"></script>
<script src="writer-app.js"></script>
</body>
</html>
